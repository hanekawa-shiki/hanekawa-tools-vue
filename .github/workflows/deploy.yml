name: 部署与打包

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy-github:
    name: Build & Deploy to GH Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键改动：用 setup-vp 替代 pnpm/action-setup + setup-node + pnpm install
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2 # 请替换为具体的 release 版本或 commit SHA
        with:
          node-version: '24' # 对应你原来的 24.x
          cache: true # 自动处理 pnpm 依赖缓存

      - name: Building for GH
        run: vp run build:gh

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist-gh
          clean: true
          force: true
