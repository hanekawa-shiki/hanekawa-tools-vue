nodeDownloadMirrors:
  release: https://npmmirror.com/mirrors/node/

shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

packages: []

allowBuilds:
  vue-demi: true

overrides:
