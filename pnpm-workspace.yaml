# nodeDownloadMirrors:
#   release: https://npmmirror.com/mirrors/node/
runtimeOnFail: ignore
pmOnFail: ignore

shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

packages: []

allowBuilds:
  vue-demi: true

minimumReleaseAgeExclude:
  - '@types/node@26.6.6'
  - eslint@10.11.0
  - '@hugeicons/core-free-icons@4.4.0'

overrides:
  '@trickfilm400/rollup-plugin-off-main-thread': 4.0.0-pre2
  vite@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
