# nodeDownloadMirrors:
#   release: https://npmmirror.com/mirrors/node/
runtimeOnFail: ignore
pmOnFail: ignore

shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

packages: []

allowBuilds:
  vue-demi: true

overrides:
  '@trickfilm400/rollup-plugin-off-main-thread': 4.0.0-pre2
  vite@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.5.1'
  - axios@1.21.1
  - vite-plus@1.5.1
